<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b"/>
      <stop offset="50%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#18181b"/>
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="30" fill="url(#bg)"/>
  <!-- Mask Circle -->
  <circle cx="100" cy="100" r="70" fill="#b91c1c" stroke="#18181b" stroke-width="6"/>
  <line x1="100" y1="30" x2="100" y2="170" stroke="#18181b" stroke-width="8"/>
  <!-- Eye patches -->
  <ellipse cx="65" cy="100" rx="22" ry="32" fill="#18181b"/>
  <ellipse cx="135" cy="100" rx="22" ry="32" fill="#18181b"/>
  <!-- White slanted eyes -->
  <polygon points="52,95 72,92 68,108 55,105" fill="#ffffff"/>
  <polygon points="148,95 128,92 132,108 145,105" fill="#ffffff"/>
</svg>
