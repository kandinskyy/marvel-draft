  <path d="M 60 55 C 60 30, 140 30, 140 55 L 145 110 C 145 145, 125 165, 100 170 C 75 165, 55 145, 55 110 Z" fill="url(#gold)"/>
  <!-- Faceplate details -->
  <path d="M 68 70 L 132 70 L 126 125 L 100 145 L 74 125 Z" fill="#991b1b"/>
  <!-- Eyes -->
